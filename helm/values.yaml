app:
  name: stirling-pdf
  namespace: stirling-pdf

image:
  registry: 192.168.8.72:32083
  name: stirling-pdf
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: pdf-editor.getbitbang.com
  annotations: {}

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

# Stirling-PDF configuration via environment variables
# Full reference: https://docs.stirlingpdf.com/Configuration
envs:
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxMetaspaceSize=256m -Xms256m -Xmx1g"
  - name: DISABLE_ADDITIONAL_FEATURES
    value: "false"
  - name: SECURITY_ENABLELOGIN
    value: "true"
  - name: SECURITY_JWT_PERSISTENCE
    value: "true"
  - name: SYSTEM_MAXFILESIZE
    value: "100"
  - name: UI_APPNAME
    value: "BitBang PDF Editor"
  - name: UI_APPNAMENAVBAR
    value: "PDF Editor"

persistence:
  enabled: true
  storageClass: nfs-client
  accessMode: ReadWriteOnce
  size: 2Gi

securityContext:
  fsGroup: 1000

serviceAccount:
  create: true
  automountServiceAccountToken: false

probes:
  liveness:
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 5
  readiness:
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 5
