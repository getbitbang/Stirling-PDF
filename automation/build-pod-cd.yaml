apiVersion: v1
kind: Pod
metadata:
  labels:
    app: stirling-pdf-cd-agent
spec:
  serviceAccountName: jenkins-agent
  containers:
    - name: helm
      image: alpine/helm:3.14.0
      command: ["cat"]
      tty: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

    - name: kubectl
      image: bitnami/kubectl:1.31
      command: ["cat"]
      tty: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

  restartPolicy: Never
