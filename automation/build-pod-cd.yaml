apiVersion: v1
kind: Pod
metadata:
  labels:
    app: stirling-pdf-cd-agent
spec:
  serviceAccountName: jenkins-agent
  containers:
    - name: helm
      image: dtzar/helm-kubectl:3.17.0
      command: ["cat"]
      tty: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

  restartPolicy: Never
